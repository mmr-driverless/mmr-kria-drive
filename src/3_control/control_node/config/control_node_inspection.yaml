/control_node:
  ros__parameters:
    tick_interval: 50 # Milliseconds. (Estimation -> control -> actuation) loop interval
    wcet_ns: 5000000 # 5ms

    estimation:
      type: Inspection
      params:
        ecu_status:
          topic: "/status/ecu"
          qos:
            reliability: best_effort
        actuator_status:
          topic: "/actuator/status"

    event_manager:
      enabled: true # Disable this on the sim or when you're using the HUMAN POWERTRAIN
      as_state:
        topic: "/as/status"
        qos:
          durability: transient_local
      race_status:
        topic: "/planning/race_status"
      stop:
        topic: "/mission/stop"
      
      rev_duration_before_engage_ms: 250
      launch_throttle: 0.5
      launch_brake: 0.15
      rev_duration_after_engage_ms: 500
      stop_light_brake: 0.15
      stop_hard_brake: 0.4
      lc_duration_after_launch_ms: 1000
      
      standstill_speed_m_s: 0.3
      standstill_time_ms: 2000
      mission_duration_ms: 10000

    control:
      type: Inspection
      params:
        frequency_hz: 0.5
        amplitude_steering_wheel_deg: 45
        throttle: 0.15
        launch_control: false
        gear: 1


    # Actuation settings
    actuation:
      actuators:
        0:
          enabled: true
          type: CANOpenBridge
          params:
            steer_topic: "/command/steer"
            brake_topic: "/command/brake"
            clutch_topic: "/command/clutch"
            actuator_status_topic: "/actuator/status"

        1:
          enabled: true
          type: SpiApps
          params:
            spi_interface: /dev/spidev1.0
            spi_frequency: 50000
            v_ref: 5.0
            v_apps_min: 0.942
            v_apps_max: 2.484
            buffered: false

        2:
          enabled: true
          type: Ecu
          params:
            topic: "/command/ecu"

        3:
          enabled: true
          type: Logger
          params:
            topic: "/control/log"

    vehicle_parameters:
      wheelbase: 1.541 # distance between front and rear axle [m]
      lr: 0.75 # distance between CoM and rear axle [m]

    tracking:
      threshold: 8.0 # Meters. If the path doesn't pass through a circle of this radius centered on the vehicle, the tracking problem is restarted (which is a problem ONLY in Skidpad) and takes longer to execute
      projection_marker:
        diameter: 1.0
        color:
          r: 1.0
          g: 0.0
          b: 0.0
          a: 1.0
      threshold_marker:
        color:
          r: 1.0
          g: 1.0
          b: 1.0
          a: 0.3
      search_start_marker:
        length: 0.7
        color:
          r: 0.0
          g: 1.0
          b: 0.0
          a: 0.8
      search_end_marker:
        length: 0.7
        color:
          r: 1.0
          g: 0.0
          b: 0.0
          a: 0.8

    vehicle_parameters:
      wheelbase_m: 1.541 # distance between front and rear axle [m]
      steering_ratio: 6.87 # Ratio between steering wheel and wheel angle (bicycle model) [1]
      lr_m: 0.7094 # distance between CoM and rear axle [m]
      scx: 1.1 # 0.99 * 1.1
      scz: 5.5 # 2.2 * 2.5
      wheel_radius_m: 0.23
      mass_kg: 260.0
      wheel_roll_coeff: 0.013
      wheel_inertia: 0.0895 # 0.0735 + 0.016
      brake_tilton_diameter_mm: 15.88
      brake_mu: 0.35 # coef attrito pastiglia-disco [adim]
      brake_disc_radius_mm: 81.50
      brake_piston_diameter_mm: 25.0
      brake_pedal_down_distance_mm: 56.0 # Distanza perno pedale-tilton
      brake_pedal_up_distance_mm: 150.0 # Distanza perno pedale-ebs
      brake_pulley_diameter_mm: 40.0
      brake_reducer: 15.58
      brake_reducer_efficiency: 0.90
      brake_min_torque: 150.0 # Any braking command under this threshold is ignored [mNm]
      differential_ratio: 3.38
      nmotvet_rpm: [ 10.0, 2500.0, 3500.0, 4500.0, 5500.0, 6500.0, 7500.0, 8500.0, 9500.0, 10500.0, 11500.0, 18000.0 ]
      cdc_Nm: [ 23.0, 23.0, 36.0, 40.0, 38.0, 44.0, 46.0, 52.0, 56.0, 51.0, 47.0, 47.0 ]
      gear_ratios: [
        +inf,
        5.5, # 77/14,
        4.052631578947368, # 77/19
        3.3846153846153846, # 77*36/39/21
        2.9615384615384617 # 77*36/39/24
      ]
      apps_map_x: [ 0.0, 0.005, 0.85, 1.0 ] # % of maximum torque
      apps_map_y: [ 0.0, 0.15, 0.75, 1.0 ] # APPS

    viz:
      enabled: false
      min_interval_ms: 100