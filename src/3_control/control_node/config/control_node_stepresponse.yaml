/control_node:
  ros__parameters:
    tick_interval: 50 # Milliseconds. (Estimation -> control -> actuation) loop interval
    wcet_ns: 5000000 # 5ms

    tracking:
      threshold: 8.0 # Meters. If the path doesn't pass through a circle of this radius centered on the vehicle, the tracking problem is restarted (which is a problem ONLY in Skidpad) and takes longer to execute
      projection_marker:
        diameter: 1.0
        color:
          r: 1.0
          g: 0.0
          b: 0.0
          a: 1.0
      threshold_marker:
        color:
          r: 1.0
          g: 1.0
          b: 1.0
          a: 0.3
      search_start_marker:
        length: 0.7
        color:
          r: 0.0
          g: 1.0
          b: 0.0
          a: 0.8
      search_end_marker:
        length: 0.7
        color:
          r: 1.0
          g: 0.0
          b: 0.0
          a: 0.8

    estimation:
      type: Noop
      params:
        clutch_disengaged_thresh: 0.5
        res_status:
          topic: "/status/res"
          qos:
            reliability: best_effort

        odometry_topic: "/Odometry"
        ecu_status:
          topic: "/status/ecu"
          qos:
            reliability: best_effort

    event_manager:
      enabled: true # Disable this on the sim or when you're using the HUMAN POWERTRAIN
      as_state:
        topic: "/as/status"
        qos:
          durability: transient_local
      race_status:
        topic: "/planning/race_status"
      stop:
        topic: "/mission/stop"
      
      rev_duration_before_engage_ms: 250
      launch_throttle: 0.5
      launch_brake: 0.15
      rev_duration_after_engage_ms: 500
      stop_light_brake: 0.15
      stop_hard_brake: 0.4
      lc_duration_after_launch_ms: 200
      
      standstill_speed_m_s: 0.3
      standstill_time_ms: 2000
      lap_to_stop: 4 # Stop when lap counter publishes this lap

    control:
      type: LongStepResponse
      params:
        step_size: 2.0 # m/s^2
        max_speed: 20.0 # m/s
        zero_duration_ms: 3000 # ms

        as_state:
          topic: "/as/status"
          qos:
            durability: transient_local

    # Actuation settings
    actuation:
      actuators:
        0:
          enabled: true
          type: SpiApps
          params:
            spi_interface: /dev/spidev1.0
            spi_frequency: 50000
            v_ref: 5.0
            v_apps_min: 0.942
            v_apps_max: 2.484
            buffered: false

        1:
          enabled: true
          type: Logger
          params:
            topic: "/control/log"

    vehicle_parameters:
      wheelbase_m: 1.541 # distance between front and rear axle [m]
      steering_ratio: 6.87 # Ratio between steering wheel and wheel angle (bicycle model) [1]
      lr_m: 0.7094 # distance between CoM and rear axle [m]
      cx: 0.99
      cz: 2.2
      sx: 1.1
      sz: 2.5
      wheel_radius_m: 0.23
      mass_kg: 260.0
      wheel_roll_coeff: 0.013
      wheel_inertia: 0.0895 # 0.0735 + 0.016
      brake_tilton_diameter_mm: 15.88
      brake_mu: 0.35 # coef attrito pastiglia-disco [adim]
      brake_disc_radius_mm: 81.50
      brake_piston_diameter_mm: 25.0
      brake_pedal_down_distance_mm: 56.0 # Distanza perno pedale-tilton
      brake_pedal_up_distance_mm: 150.0 # Distanza perno pedale-ebs
      brake_pulley_diameter_mm: 40.0
      brake_reducer: 15.58
      brake_reducer_efficiency: 0.90
      differential_ratio: 3.38
      nmotvet_rpm: [ 10, 2500, 3500, 4500, 5500, 6500, 7500, 8500, 9500, 10500, 11500, 18000 ]
      cdc_Nm: [ 23, 23, 36, 40, 38, 44, 46, 52, 56, 51, 47, 47 ]
      gear_ratios: [
        0.0, # std::numeric_limits<int>::infinity()
        5.5, # 77/14,
        4.0, #.052631578947368, # 77/19
        3.0, #.3846153846153846, # 77*36/39/21
        2.0, #.9615384615384617 # 77*36/39/24
      ]

    
    viz:
      enabled: false
      topic: "/control/viz"
      min_interval_ms: 100
