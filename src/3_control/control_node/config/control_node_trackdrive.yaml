/control_node:
  ros__parameters:
    tick_interval: 50 # Milliseconds. (Estimation -> control -> actuation) loop interval
    wcet_ns: 5000000 # 5ms

    tracking:
      threshold: 8.0 # Meters. If the path doesn't pass through a circle of this radius centered on the vehicle, the tracking problem is restarted (which is a problem ONLY in Skidpad) and takes longer to execute
      projection_marker:
        diameter: 1.0
        color:
          r: 1.0
          g: 0.0
          b: 0.0
          a: 1.0
      threshold_marker:
        color:
          r: 1.0
          g: 1.0
          b: 1.0
          a: 0.3
      search_start_marker:
        length: 0.7
        color:
          r: 0.0
          g: 1.0
          b: 0.0
          a: 0.8
      search_end_marker:
        length: 0.7
        color:
          r: 1.0
          g: 0.0
          b: 0.0
          a: 0.8

    estimation:
      type: Noop
      params:
        odometry_topic: "/Odometry"
        ecu_status:
          topic: "/ecu_status"
        actuator_status:
          topic: "/actuator_status"

    event_manager:
      enabled: false # Disable this on the sim or when you're using the HUMAN POWERTRAIN
      as_state:
        topic: "/as/state"
      race_status:
        topic: "/planning/race_status"
      stop:
        topic: "/stop"
      use_lc: true
      launch_throttle: 0.1
      launch_brake: 10.0
      launch_rpm: 3000
      launch_speed: 4.0
      standstill_speed: 0.3
      stop_brake: 10.0
      lap_to_stop: 12 # Stop when lap counter publishes this lap
      launch_control_timeout_ms: 2000

    control:
      type: PurePursuit2023
      params:
        minLookForward: 5.0
        minLookForwardGain: 0.4
        steerGain: 1.0
        minSpeed: 3.33
        minSpeedDistance: 5.0

        accel_apps_p: 0.15
        accel_brake_p: 0.1
        accel_lookforward: 6.2
        accel_k_smooth: 0.05

        dynamicTargetSpeed:
          enabled: true # If this is false, then minSpeed is used.
          slowLaps: -1
          k_smooth: 0.1
          maxSpeed: 8.0
          targetSpeedWeight: 0.85

        target_marker:
          diameter: 1.0
          color:
            r: 0.0
            g: 1.0
            b: 0.0
            a: 1.0


    # Actuation settings
    actuation:
      actuators:
        0:
          enabled: false
          type: CANOpenBridge
          params:
            steer_topic: "/command/steer"
            brake_topic: "/command/brake"
            clutch_topic: "/command/clutch"
            actuator_status_topic: "/actuator_status"

        1:
          enabled: true
          type: Sim
          params:
            topic: "/sim/drive_parameters"

        2:
          enabled: false
          type: SpiApps
          params:
            spi_interface: /dev/spidev1.0
            spi_frequency: 50000
            v_ref: 5.0
            v_apps_min: 1.0
            v_apps_max: 3.0

        3:
          enabled: false
          type: Ecu
          params:
            topic: "/command/ecu"


    # Reference path settings
    reference_path_manager:
      # Reference path sources in order of priority, 0 is highest
      # Whenever a path from a higher priority source is received, any lower priority source is destroyed
      sources:
        0:
          enabled: false
          type: "ROS_SpeedProfilePoints"
          params:
            topic: "/planning/global"
            is_closed: true

        1:
          enabled: true
          type: "ROS_Marker"
          params:
            topic: "/planning/center_line_completed"
            is_closed: true
            qos_override:
              durability: transient_local
              reliability: reliable

        2:
          enabled: true
          type: "ROS_Marker"
          params:
            topic: "/planning/center_line"
            is_closed: false
            
      # Uncomment this to dump paths to file
      # dump_paths_dir: '/home/simonebondi/Desktop/dump_dir'

    vehicle_parameters:
      wheelbase_m: 1.541 # distance between front and rear axle [m]
      lr_m: 0.75 # distance between CoM and rear axle [m]
      max_steering_angle_rad: 0.3979351 # maximum angle at the wheel [rad]
      cx: 0.99
      cz: 2.2
      sx: 1.1
      sz: 2.5
      wheel_radius_m: 0.23
      mass_kg: 260.0
      wheel_roll_coeff: 0.013
      wheel_inertia: 0.0895 # 0.0735 + 0.016
      brake_tilton_diameter_mm: 15.88
      brake_mu: 0.35 # coef attrito pastiglia-disco [adim]
      brake_disc_radius_mm: 81.50
      brake_piston_diameter_mm: 25.0
      brake_pedal_down_distance_mm: 56.0 # Distanza perno pedale-tilton
      brake_pedal_up_distance_mm: 150.0 # Distanza perno pedale-ebs
      brake_pulley_diameter_mm: 40.0
      brake_reducer: 15.58
      brake_reducer_efficiency: 0.90
      differential_ratio: 3.38
      nmotvet_rpm: [ 10, 2500, 3500, 4500, 5500, 6500, 7500, 8500, 9500, 10500, 11500, 18000 ]
      cdc_Nm: [ 23, 23, 36, 40, 38, 44, 46, 52, 56, 51, 47, 47 ]
      gear_ratios: [
        0, # std::numeric_limits<int>::infinity()
        5.5, # 77/14,
        4.0, #.052631578947368, # 77/19
        3.0, #.3846153846153846, # 77*36/39/21
        2.0, #.9615384615384617 # 77*36/39/24
      ]

    
    viz:
      enabled: true
      topic: "/control/viz"
      min_interval_ms: 100
