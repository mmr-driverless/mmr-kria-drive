/canopen_bridge_node:
  ros__parameters:
    generic:
      interface: can1
      bitrate: 1000000
      debug: true
      WCET: 5000000 # ms
      period: 10000000 # 10ms
      deadline: 10000000
    topic:
      steerTopic: "/command/steer"
      brakeTopic: "/command/brake"
      clutchTopic: "/command/clutch"
      statusActuatorTopic: "/actuator/status"
      ecuStatusTopic: "/status/ecu"
    steer:
      node_id: 18
      wheel_rate: 6.4286
      inc_per_degree: 179.7224 # riduzione 1-4 44.9306
      max_target_pot: 135.0
      max_target_wheel: 20.0
      max_target_maxon: 24000.0
      velocity: 2750
      timeout_msgs: 5
      control_mode: 1 # if you want relative: 1, absolute: 0
    brake:
      node_id: 17
      max_torque: 1500
      return_pedal_torque: -20
      timeout_msgs: 2
      monitor_freq: 100
    clutch:
      node_id: 16
      velocity: 3500
      monitoring_freq: 5
      timeout_msgs: 2
      step_maxon:
        - -200
        - 1800
        - -1000
        - -250
        - -800
        - -400
      pot_val: 
        - 2.5
        - 80.0
        - 55.0
        - 32.5
        - 12.5
        - 2.5
